name: Publish image

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        id: version
        run: |
          echo "upstream=$(tr -d '[:space:]' < UPSTREAM_VERSION)" >> "$GITHUB_OUTPUT"
          echo "patch=$(tr -d '[:space:]' < PATCH_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Check out upstream Linkding
        run: |
          git clone --depth 1 --branch "${{ steps.version.outputs.upstream }}" \
            https://github.com/sissbruecker/linkding.git source
      - name: Apply patch
        run: |
          git -C source apply --check ../patches/usage-tracking.patch
          git -C source apply ../patches/usage-tracking.patch
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: source
          file: source/docker/default.Dockerfile
          target: linkding
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: dafal/linkding:${{ steps.version.outputs.upstream }}-usage.${{ steps.version.outputs.patch }}
